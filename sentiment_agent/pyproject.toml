[project]
name = "agentic-sentiment-pipeline"
version = "0.1.0"
description = "Agentic sentiment pipeline for PSU + NBFC using LangGraph"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "requests>=2.30.0",
    "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
finbert = ["transformers>=4.40.0", "torch>=2.2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
